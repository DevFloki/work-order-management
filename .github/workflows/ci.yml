name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: workorder_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d workorder_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
           
      - name: Restore dependencies
        run: dotnet restore
         
      - name: Build solution
        run: dotnet build --configuration Release --no-restore
        
      - name: Run tests
        run: dotnet test --configuration Release --no-build
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=dummy;Username=dummy;Password=dummy"
          ConnectionStrings__TestConnection: "Host=localhost;Port=5432;Database=workorder_ci;Username=postgres;Password=postgres"

      - name: Publish API
        run: dotnet publish ./WorkOrderManagement.Api/WorkOrderManagement.Api.csproj --configuration Release --no-build --output ./publish

      - name: Upload API artifact
        uses: actions/upload-artifact@v7
        with:
          name: workorder-api
          path: ./publish/
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v7
        with:
          name: workorder-api
          path: ./publish

      - name: Verify published files
        run: |
          ls -lah ./publish
          test -f ./publish/WorkOrderManagement.Api.dll

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure login
        run: az account show --query name --output tsv

      - name: Deploy API to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: workorder-api-devfloki
          package: ./publish

