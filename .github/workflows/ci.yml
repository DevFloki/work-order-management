name: CI

on:
    push:
    pull_request:

jobs:
    build:
      runs-on: ubuntu-latest
        
      steps:
        - name: Checkout repository
          uses: actions/checkout@v7
          
        - name: Setup .NET
          uses: actions/setup-dotnet@v6
          with:
            dotnet-version: '10.0.x'
           
        - name: Restore dependencies
          run: dotnet restore
         
        - name: Build solution
          run: dotnet build --configuration Release --no-restore
